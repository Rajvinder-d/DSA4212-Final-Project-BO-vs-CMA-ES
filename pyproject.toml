[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bo-vs-es"
version = "0.1.0"
description = "Reproducible rotation and conditioning study with CALCE battery data"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy", "pandas", "scipy", "matplotlib", "openpyxl", "torch", "botorch", "gpytorch", "cma", "nbformat", "nbclient", "ipykernel"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
